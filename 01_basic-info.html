<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
@font-face{font-family:"tabler-icons";font-style:normal;font-weight:400;font-display:block;src:url("https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/fonts/tabler-icons.woff2") format("woff2");}
.ti{font-family:"tabler-icons"!important;font-style:normal;font-weight:400;line-height:1;-webkit-font-smoothing:antialiased;display:inline-block;vertical-align:middle;}
.ti-id::before{content:"\eac3";}
html,body{margin:0;padding:0;height:100%;font-family:"Pretendard","Pretendard Variable",-apple-system,sans-serif;}
body{background:#1a2a5e;display:flex;align-items:center;min-height:100vh;box-sizing:border-box;padding:0 18px;}
.nh{display:flex;align-items:center;gap:9px;color:#fff;font-size:17px;font-weight:600;}
.nh i{font-size:21px;opacity:.92;}
</style></head><body>
<div class="nh"><i class="ti ti-id"></i>기본 정보</div>
</body></html>
