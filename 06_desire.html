<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
@font-face{font-family:"tabler-icons";font-style:normal;font-weight:400;font-display:block;src:url("https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/fonts/tabler-icons.woff2") format("woff2");}
.ti{font-family:"tabler-icons"!important;font-style:normal;font-weight:400;line-height:1;-webkit-font-smoothing:antialiased;display:inline-block;vertical-align:middle;}
.ti-flame::before{content:"\ec2c";}
html,body{margin:0;padding:0;height:100%;background:transparent;font-family:"Pretendard","Pretendard Variable",-apple-system,sans-serif;}
body{display:flex;flex-direction:column;justify-content:center;min-height:100vh;box-sizing:border-box;}
.nh-tab{display:inline-flex;align-items:center;gap:8px;background:#c47f6e;color:#fff;font-size:16px;font-weight:600;padding:9px 20px 9px 15px;border-radius:8px 8px 0 0;box-sizing:border-box;align-self:flex-start;}
.nh-tab i{font-size:18px;}
.rule{border:none;border-top:2px solid #c47f6e;margin:0;width:100%;}
</style></head><body>
<div class="nh-tab"><i class="ti ti-flame"></i>욕구</div>
<hr class="rule">
</body></html>
