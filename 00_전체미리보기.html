<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>김산 소제목 미리보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
@font-face{font-family:"tabler-icons";font-style:normal;font-weight:400;font-display:block;src:url("https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/fonts/tabler-icons.woff2") format("woff2");}
.ti{font-family:"tabler-icons"!important;font-style:normal;font-weight:400;line-height:1;-webkit-font-smoothing:antialiased;display:inline-block;vertical-align:middle;}
.ti-id::before{content:"\eac3";}
.ti-face-id::before{content:"\ea9b";}
.ti-mood-smile::before{content:"\eaf7";}
.ti-timeline::before{content:"\f031";}
.ti-target::before{content:"\eb35";}
.ti-flame::before{content:"\ec2c";}
.ti-shield-half::before{content:"\f358";}
.ti-message-2::before{content:"\eaec";}
.ti-users::before{content:"\ebf2";}
.ti-bulb::before{content:"\ea51";}
.ti-alert-triangle::before{content:"\ea06";}
.ti-shirt::before{content:"\ec0a";}
body{margin:0 auto;padding:32px 24px;background:#f4f4f2;font-family:"Pretendard","Pretendard Variable",-apple-system,sans-serif;max-width:680px;}
.nh{display:flex;align-items:center;gap:9px;background:#1a2a5e;color:#fff;font-size:17px;font-weight:600;padding:11px 18px;border-radius:8px;}
.nh i{font-size:21px;opacity:.92;}
.nh-tab{display:inline-flex;align-items:center;gap:8px;background:#1a2a5e;color:#fff;font-size:16px;font-weight:600;padding:9px 20px 9px 15px;border-radius:8px 8px 0 0;}
.nh-tab i{font-size:18px;}
.rule{border:none;border-top:2px solid #1a2a5e;margin:0;}
.note{font-size:12.5px;color:#888;margin:22px 0 6px;}
.sp{height:14px;}
</style></head><body>
<p class="note">— 스타일 A (파일 01)</p>
<div class="nh"><i class="ti ti-id"></i>기본 정보</div>
<p class="note">— 스타일 C (파일 02~12)</p>
<div class="nh-tab"><i class="ti ti-face-id"></i>외모</div><hr class="rule"><div class="sp"></div>
<div class="nh-tab"><i class="ti ti-mood-smile"></i>성격</div><hr class="rule"><div class="sp"></div>
<div class="nh-tab"><i class="ti ti-timeline"></i>생애주기</div><hr class="rule"><div class="sp"></div>
<div class="nh-tab"><i class="ti ti-target"></i>동기 · 트리거 · 터닝포인트</div><hr class="rule"><div class="sp"></div>
<div class="nh-tab"><i class="ti ti-flame"></i>욕구</div><hr class="rule"><div class="sp"></div>
<div class="nh-tab"><i class="ti ti-shield-half"></i>방어기제</div><hr class="rule"><div class="sp"></div>
<div class="nh-tab"><i class="ti ti-message-2"></i>말투 · 예시</div><hr class="rule"><div class="sp"></div>
<div class="nh-tab"><i class="ti ti-users"></i>대인관계</div><hr class="rule"><div class="sp"></div>
<div class="nh-tab"><i class="ti ti-bulb"></i>TMI</div><hr class="rule"><div class="sp"></div>
<div class="nh-tab"><i class="ti ti-alert-triangle"></i>중요사항 · NG요소</div><hr class="rule"><div class="sp"></div>
<div class="nh-tab"><i class="ti ti-shirt"></i>의상</div><hr class="rule">
</body></html>
