<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
@font-face{font-family:"tabler-icons";font-style:normal;font-weight:400;font-display:block;src:url("https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/fonts/tabler-icons.woff2") format("woff2");}
.ti{font-family:"tabler-icons"!important;font-style:normal;font-weight:400;line-height:1;-webkit-font-smoothing:antialiased;display:inline-block;vertical-align:middle;}
.ti-id::before{content:"\eac3";}
.ti-face-id::before{content:"\ea9b";}
.ti-mood-smile::before{content:"\eaf7";}
.ti-timeline::before{content:"\f031";}
.ti-target::before{content:"\eb35";}
.ti-flame::before{content:"\ec2c";}
.ti-shield-half::before{content:"\f358";}
.ti-message-2::before{content:"\eaec";}
.ti-users::before{content:"\ebf2";}
.ti-bulb::before{content:"\ea51";}
.ti-alert-triangle::before{content:"\ea06";}
.ti-shirt::before{content:"\ec0a";}
html,body{margin:0;padding:0;background:transparent;font-family:"Pretendard","Pretendard Variable",-apple-system,sans-serif;}
.nh{display:flex;align-items:center;gap:9px;background:#1a2a5e;color:#fff;font-size:17px;font-weight:600;padding:11px 18px;border-radius:8px;box-sizing:border-box;}
.nh i{font-size:21px;opacity:.92;}
.nh-tab{display:inline-flex;align-items:center;gap:8px;background:#1a2a5e;color:#fff;font-size:16px;font-weight:600;padding:9px 20px 9px 15px;border-radius:8px 8px 0 0;box-sizing:border-box;}
.nh-tab i{font-size:18px;}
.rule{border:none;border-top:2px solid #1a2a5e;margin:0;}
</style></head><body>
<div class="nh-tab"><i class="ti ti-bulb"></i>TMI</div>
<hr class="rule">
</body></html>
